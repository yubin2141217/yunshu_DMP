<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4ebff"/>
      <stop offset="42%" stop-color="#eef6ff"/>
      <stop offset="100%" stop-color="#f8fbff"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#cfe8ff" stop-opacity="0.22"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <circle cx="210" cy="180" r="220" fill="#7ec4ff" opacity="0.28" filter="url(#soft)"/>
  <circle cx="1680" cy="220" r="280" fill="#4aa3ff" opacity="0.22" filter="url(#soft)"/>
  <circle cx="1520" cy="760" r="260" fill="#1890ff" opacity="0.18" filter="url(#soft)"/>
