  <circle cx="1280" cy="160" r="210" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.55" stroke-width="10"/>
  <circle cx="1480" cy="420" r="92" fill="#2f90ff"/>
  <circle cx="1480" cy="420" r="92" fill="#7ec8ff" opacity="0.35"/>
  <circle cx="240" cy="640" r="70" fill="#3dbbff"/>
  <circle cx="1120" cy="900" r="54" fill="#1890ff" opacity="0.85"/>
  <circle cx="620" cy="240" r="160" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.4" stroke-width="8"/>
  <circle cx="1760" cy="980" r="180" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.35" stroke-width="8"/>
</svg>
